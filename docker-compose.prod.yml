# Production stack. All secrets come from .env.production (never committed).
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes:
      - static:/app/staticfiles
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Daily billing jobs (fee reminders, platform past-due marking). Idempotent,
  # so it also runs once on start. Hour is UTC (04 UTC = 07:00 Asia/Aden).
  jobs:
    build: { context: ., dockerfile: backend/Dockerfile }
    restart: always
    env_file: .env.production
    environment:
      POSTGRES_HOST: postgres
      RUN_ON_START: "1"
    volumes:
      - ./deploy/scheduler:/scheduler:ro
    command: ["sh", "/scheduler/daily.sh", "${BILLING_JOB_HOUR_UTC:-4}", "python", "manage.py", "run_billing_jobs"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Nightly database + media backup into ./backups with retention (KEEP_DAYS).
  # Hour is UTC (23 UTC = 02:00 Asia/Aden). Copy ./backups off the server.
  backup:
    image: postgres:16
    restart: always
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/scheduler:/scheduler:ro
      - ./backups:/backups
      - media:/media-src:ro
    command: ["sh", "/scheduler/daily.sh", "${BACKUP_HOUR_UTC:-23}", "sh", "/scheduler/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: web_portal/Dockerfile }
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  static:
